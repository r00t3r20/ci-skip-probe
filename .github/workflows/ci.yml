name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}

jobs:
  validate:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Validate (skipped for title or body edit)' || 'Validate' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sleep 45 && test ! -f FAIL

  validate-copy:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Validate' || 'Validate copy (runs only for a title or body edit)' }}
    if: github.event.action == 'edited' && !github.event.changes.base
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: Copy the latest Validate result for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          suite=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .check_suite_id)
          conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Validate&filter=all&per_page=100" \
            --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and .check_suite.id != $suite and .status == \"completed\")] | sort_by(.completed_at) | last | .conclusion // \"none\"")
          echo "Latest Validate for $SHA: $conclusion"
          test "$conclusion" = success
